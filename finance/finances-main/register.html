<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Expense Tracker</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <h2>Register</h2>
    <form id="registerForm">
      <input type="text" id="regUsername" placeholder="Choose a Username" required>
      <input type="password" id="regPassword" placeholder="Choose a Password" required>
      <button type="submit">Register</button>
      <p id="register-msg"></p>
      <p>Already have an account? <a href="login.html">Login</a></p>
    </form>
  </div>
  <script>
    document.getElementById('registerForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const username = document.getElementById('regUsername').value;
      const password = document.getElementById('regPassword').value;

      localStorage.setItem('username', username);
      localStorage.setItem('password', password);

      document.getElementById('register-msg').textContent = "Registered successfully!";
    });
  </script>
</body>
</html>
